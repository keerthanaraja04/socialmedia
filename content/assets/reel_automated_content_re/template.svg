<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1080" height="1920" fill="url(#bgGrad)" />

  <!-- Hook Card (0s - 2s overlay) -->
  <g transform="translate(70, 500)" filter="url(#cardShadow)">
    <rect width="940" height="340" rx="28" fill="#1E293B" fill-opacity="0.9" stroke="#10B981" stroke-width="4" />
    <rect x="44" y="36" width="360" height="48" rx="12" fill="#6366F1" />
    <text x="60" y="68" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">INCUBRIX // BREAKTHROUGH</text>
    <text x="44" y="160" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="bold" fill="#F8FAFC">Stop cutting video clips manually.</text>
  </g>

  <!-- Caption Pill Area (y: 1300) -->
  <g transform="translate(70, 1300)">
    <rect width="940" height="140" rx="24" fill="#1E293B" fill-opacity="0.85" stroke="#10B981" stroke-width="3" />
    <text x="470" y="82" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF">Sample Captions Overlay</text>
  </g>
</svg>